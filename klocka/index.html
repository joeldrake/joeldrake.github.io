<!doctype html>
<html lang="sv">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Klocka</title>
		<style>
			:root {
				--hour: #1f3a5f;
				--minute: #2f80ed;
				--second: #e5383b;
				--face: #fffdf7;
				--ink: #222;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.5rem;
				padding: 1.5rem 1rem;
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				background: #f3efe6;
				color: var(--ink);
			}

			svg {
				width: min(92vw, 78vh, 640px);
				height: auto;
				display: block;
			}

			.legend {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 0.75rem 1.75rem;
				font-size: 1.15rem;
			}

			.legend span {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
			}

			.swatch {
				display: inline-block;
				border-radius: 999px;
			}

			.swatch.hour {
				width: 2rem;
				height: 0.7rem;
				background: var(--hour);
			}
			.swatch.minute {
				width: 3rem;
				height: 0.4rem;
				background: var(--minute);
			}
			.swatch.second {
				width: 3.4rem;
				height: 0.15rem;
				background: var(--second);
			}

			.digital {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.5rem;
			}

			button {
				font: inherit;
				font-size: 1rem;
				padding: 0.5rem 1rem;
				border-radius: 0.5rem;
				border: 2px solid var(--hour);
				background: #fff;
				color: var(--hour);
				cursor: pointer;
			}

			#digitalTime {
				font-size: 2.5rem;
				font-variant-numeric: tabular-nums;
				letter-spacing: 0.05em;
			}

			#digitalTime .h {
				color: var(--hour);
			}
			#digitalTime .m {
				color: var(--minute);
			}
			#digitalTime .s {
				color: var(--second);
			}
		</style>
	</head>
	<body>
		<svg id="clock" viewBox="-200 -200 400 400" role="img" aria-label="Analog klocka">
			<!-- Urtavla -->
			<circle r="190" fill="var(--face)" stroke="var(--ink)" stroke-width="8" />

			<g id="ticks"></g>
			<g id="hourNumbers"></g>

			<!-- Timvisare: kort och tjock -->
			<g id="hourHand">
				<line
					x1="0"
					y1="18"
					x2="0"
					y2="-95"
					stroke="var(--hour)"
					stroke-width="16"
					stroke-linecap="round"
				/>
			</g>

			<!-- Minutvisare: lång och mellantjock -->
			<g id="minuteHand">
				<line
					x1="0"
					y1="22"
					x2="0"
					y2="-160"
					stroke="var(--minute)"
					stroke-width="8"
					stroke-linecap="round"
				/>
			</g>

			<!-- Sekundvisare: lång, tunn och röd -->
			<g id="secondHand">
				<line
					x1="0"
					y1="35"
					x2="0"
					y2="-172"
					stroke="var(--second)"
					stroke-width="3"
					stroke-linecap="round"
				/>
				<circle r="9" fill="var(--second)" />
			</g>

			<circle r="4" fill="#fff" />
		</svg>

		<div class="legend">
			<span><i class="swatch hour"></i> TIMME</span>
			<span><i class="swatch minute"></i> MINUT</span>
			<span><i class="swatch second"></i> SEKUND</span>
		</div>

		<div class="digital">
			<button id="toggleDigital" type="button">Visa digital tid</button>
			<div id="digitalTime" hidden></div>
		</div>

		<script>
			const SVG_NS = 'http://www.w3.org/2000/svg';

			function el(name, attrs, text) {
				const node = document.createElementNS(SVG_NS, name);
				for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
				if (text !== undefined) node.textContent = text;
				return node;
			}

			function polar(angleDeg, radius) {
				const rad = ((angleDeg - 90) * Math.PI) / 180;
				return [Math.cos(rad) * radius, Math.sin(rad) * radius];
			}

			// Markeringar: 60 minutstreck, tjockare vid varje timme
			const ticks = document.getElementById('ticks');
			for (let i = 0; i < 60; i++) {
				const isHour = i % 5 === 0;
				const [x1, y1] = polar(i * 6, isHour ? 160 : 172);
				const [x2, y2] = polar(i * 6, 184);
				ticks.appendChild(
					el('line', {
						x1,
						y1,
						x2,
						y2,
						stroke: isHour ? 'var(--ink)' : '#777',
						'stroke-width': isHour ? 6 : 2,
						'stroke-linecap': 'round'
					})
				);
			}

			// Timsiffror 1–12, i timvisarens färg
			const hourNumbers = document.getElementById('hourNumbers');
			for (let h = 1; h <= 12; h++) {
				const [x, y] = polar(h * 30, 128);
				hourNumbers.appendChild(
					el(
						'text',
						{
							x,
							y,
							'text-anchor': 'middle',
							'dominant-baseline': 'central',
							'font-size': 40,
							'font-weight': 700,
							fill: 'var(--hour)',
							'font-family': 'system-ui, -apple-system, sans-serif'
						},
						h
					)
				);
			}

			const hourHand = document.getElementById('hourHand');
			const minuteHand = document.getElementById('minuteHand');
			const secondHand = document.getElementById('secondHand');
			const digitalTime = document.getElementById('digitalTime');
			const toggle = document.getElementById('toggleDigital');

			const pad = (n) => String(n).padStart(2, '0');

			function update() {
				const now = new Date();
				const h = now.getHours();
				const m = now.getMinutes();
				const s = now.getSeconds();

				hourHand.setAttribute('transform', `rotate(${((h % 12) + m / 60) * 30})`);
				minuteHand.setAttribute('transform', `rotate(${(m + s / 60) * 6})`);
				secondHand.setAttribute('transform', `rotate(${s * 6})`);

				digitalTime.innerHTML = `<span class="h">${pad(h)}</span>:<span class="m">${pad(m)}</span>:<span class="s">${pad(s)}</span>`;
			}

			toggle.addEventListener('click', () => {
				digitalTime.hidden = !digitalTime.hidden;
				toggle.textContent = digitalTime.hidden ? 'Visa digital tid' : 'Dölj digital tid';
			});

			update();
			setInterval(update, 250);
		</script>
	</body>
</html>
