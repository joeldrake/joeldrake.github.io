<!doctype html>
<html lang="sv">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Världen</title>
		<link rel="manifest" href="manifest.json" />
		<link rel="icon" href="icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Världen" />

		<link

		<link

		<link

		/>
		<link
			rel="apple-touch-startup-image"
			href="splash/1170x2532.png"
			media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="splash/1284x2778.png"
			media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="splash/1179x2556.png"
			media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="splash/1290x2796.png"
			media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="splash/1206x2622.png"
			media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="splash/1320x2868.png"
			media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="splash/1260x2736.png"
			media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--ink: #2b2d42;
				--accent: #7b2cbf;
				--good: #2a9d8f;
				--bad: #e63946;
				--gold: #ffb703;
				--ocean: #6cb4ee;
				/* Världsdelarnas färger på kartan */
				--af: #ffb26b;
				--eu: #8fb0ff;
				--as: #ffd966;
				--na: #8fd694;
				--sa: #ff9ebb;
				--oc: #c9a7ff;
				--an: #f4f9ff;
			}

			* {
				box-sizing: border-box;
			}

			/* Stäng av dubbeltryck-zoom (snabba tryck på knappar), nypzoom fungerar fortfarande */
			html {
				touch-action: manipulation;
			}

			[hidden] {
				display: none !important;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.9rem;
				/* Håll innehållet fritt från notch och hemindikator i helskärmsläge */
				padding: calc(1rem + env(safe-area-inset-top, 0px))
					calc(1rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px))
					calc(1rem + env(safe-area-inset-left, 0px));
				font-family:
					'Fredoka',
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				color: var(--ink);
				/* Blå grundfärg så att det aldrig blinkar vitt innan bakgrunden ritats */
				background-color: #a2d2ff;
				background-image: linear-gradient(#a2d2ff, #e7f5ff);
				background-attachment: fixed;
				overflow-x: hidden;
			}

			body[data-mode='hitta'] {
				background-image: linear-gradient(#b9fbc0, #fdffb6);
			}

			header {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				width: 100%;
				max-width: 72rem;
			}

			.mode-icon {
				font-size: 3rem;
				line-height: 1;
				animation: spin-bob 4s ease-in-out infinite;
			}

			h1 {
				margin: 0;
				font-size: clamp(1.8rem, 6vw, 2.6rem);
				font-weight: 700;
			}

			#modeText {
				margin: 0;
				font-size: 1.1rem;
				text-wrap: pretty;
			}

			.header-buttons {
				margin-left: auto;
				display: flex;
				gap: 0.4rem;
				flex: none;
			}

			#soundToggle {
				font-size: 1.4rem;
				padding: 0.2rem 0.55rem;
			}

			.tabs {
				display: flex;
				justify-content: center;
				gap: 0.5rem;
			}

			button {
				font: inherit;
				cursor: pointer;
				border-radius: 999px;
				border: 3px solid var(--ink);
				background: #fff;
				color: var(--ink);
				padding: 0.45rem 1rem;
				font-size: 1rem;
				font-weight: 600;
				transition:
					transform 0.1s,
					background 0.2s;
			}

			button:active {
				transform: scale(0.95);
			}

			.tab {
				font-size: clamp(0.95rem, 4vw, 1.15rem);
				white-space: nowrap;
			}

			.tab.active {
				background: var(--ink);
				color: #fff;
			}

			/* ---------- Layout: kartan till vänster, kortet till höger på stora skärmar ---------- */

			.layout {
				width: 100%;
				max-width: 72rem;
				display: grid;
				gap: 0.9rem;
				align-items: start;
			}

			@media (min-width: 62rem) {
				.layout {
					grid-template-columns: minmax(0, 1fr) 21rem;
				}
			}

			.map-col,
			.side {
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
				min-width: 0;
			}

			.panel {
				width: 100%;
				background: rgba(255, 255, 255, 0.94);
				color: var(--ink);
				border-radius: 1.5rem;
				padding: 1rem 1.25rem;
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
			}

			@media (max-width: 480px) {
				.panel {
					padding-inline: 0.9rem;
				}
			}

			/* ---------- Kartan ---------- */

			.map-wrap {
				position: relative;
				width: 100%;
				aspect-ratio: 1000 / 560;
				max-height: 76vh;
				border: 3px solid var(--ink);
				border-radius: 1.5rem;
				overflow: hidden;
				background: #d6ecff;
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
			}

			/* Lite luft ovanför kartan när den scrollas upp, och fri från notchen */
			.map-wrap {
				scroll-margin-top: calc(0.5rem + env(safe-area-inset-top, 0px));
			}

			.map-wrap.big {
				aspect-ratio: auto;
				height: 72vh;
			}

			#map {
				display: block;
				width: 100%;
				height: 100%;
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
				-webkit-tap-highlight-color: transparent;
				cursor: grab;
			}

			#map:active {
				cursor: grabbing;
			}

			.sphere {
				fill: var(--ocean);
			}

			.grat {
				fill: none;
				stroke: #fff;
				stroke-opacity: 0.25;
				stroke-width: 0.6;
				vector-effect: non-scaling-stroke;
			}

			.land {
				stroke: var(--ink);
				stroke-opacity: 0.45;
				stroke-width: 0.7;
				stroke-linejoin: round;
				vector-effect: non-scaling-stroke;
				cursor: pointer;
				transition:
					fill 0.25s,
					fill-opacity 0.25s;
			}

			.c-af {
				fill: var(--af);
			}
			.c-eu {
				fill: var(--eu);
			}
			.c-as {
				fill: var(--as);
			}
			.c-na {
				fill: var(--na);
			}
			.c-sa {
				fill: var(--sa);
			}
			.c-oc {
				fill: var(--oc);
			}
			.c-an {
				fill: var(--an);
			}

			@media (hover: hover) {
				.land:hover {
					fill-opacity: 0.7;
				}
			}

			.land.dim {
				fill-opacity: 0.35;
			}

			.land.sel {
				fill: var(--accent);
				fill-opacity: 1;
				stroke: #fff;
				stroke-width: 2;
				stroke-opacity: 1;
			}

			.land.right,
			.land.reveal {
				fill: var(--good);
				fill-opacity: 1;
				stroke: #fff;
				stroke-width: 2;
				stroke-opacity: 1;
			}

			.land.reveal {
				animation: blink 0.8s ease-in-out infinite;
			}

			.land.wrong {
				fill: var(--bad);
				fill-opacity: 1;
			}

			.marker,
			.ocean-label {
				cursor: pointer;
			}

			.marker .pin {
				transform-box: fill-box;
				transform-origin: center;
			}

			.marker circle {
				fill: #fff;
				stroke: var(--accent);
				stroke-width: 3;
			}

			.marker.found circle {
				fill: #fff3c4;
				stroke: var(--gold);
			}

			.marker.reveal .pin,
			.marker.right .pin {
				animation: glow 0.8s ease-in-out infinite;
			}

			.marker.right circle,
			.marker.reveal circle {
				stroke: var(--good);
				stroke-width: 5;
			}

			.marker text {
				font-size: 17px;
			}

			.ocean-label text {
				font-size: 14px;
				font-weight: 600;
				font-style: italic;
				fill: #12406e;
				stroke: #fff;
				stroke-width: 3px;
				stroke-opacity: 0.6;
				paint-order: stroke;
				letter-spacing: 0.04em;
			}

			.ocean-label.reveal text,
			.ocean-label.right text {
				fill: var(--good);
				stroke-opacity: 1;
				animation: blink 0.8s ease-in-out infinite;
			}

			#map.hide-markers .marker {
				display: none;
			}

			.map-tools {
				position: absolute;
				right: 0.5rem;
				bottom: 0.5rem;
				display: flex;
				flex-direction: column;
				gap: 0.35rem;
			}

			.map-tools button {
				width: 2.6rem;
				height: 2.6rem;
				padding: 0;
				font-size: 1.3rem;
				line-height: 1;
				border-width: 2px;
				box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
				/* Centrerar ikonerna exakt – Fredokas + och − sitter för lågt i radhöjden */
				display: grid;
				place-items: center;
			}

			.map-tools svg {
				width: 55%;
				height: 55%;
				fill: none;
				stroke: currentColor;
				stroke-width: 3;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			/* Telefon: högre karta och zoomknapparna på en rad så att de inte täcker så mycket */
			@media (max-width: 600px) {
				.map-wrap {
					aspect-ratio: 1 / 0.82;
					border-radius: 1.1rem;
				}

				.map-tools {
					flex-direction: row;
					right: 0.4rem;
					bottom: 0.4rem;
					gap: 0.3rem;
				}

				.map-tools button {
					width: 2.2rem;
					height: 2.2rem;
					font-size: 1.1rem;
				}
			}

			/* ---------- Världsdelsknappar ---------- */

			.continents {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 0.4rem;
			}

			.continents button {
				font-size: clamp(0.85rem, 3.4vw, 1rem);
				padding: 0.35rem 0.8rem;
				border-width: 2px;
				white-space: nowrap;
				background: var(--c);
			}

			/* ---------- Frågeraden ---------- */

			.quiz-bar {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				text-align: left;
			}

			#qIcon {
				font-size: clamp(2.6rem, 10vw, 3.4rem);
				line-height: 1;
				flex: none;
			}

			#qText {
				margin: 0;
				font-size: clamp(1.15rem, 4.5vw, 1.5rem);
				font-weight: 600;
				text-wrap: balance;
			}

			#qText b {
				color: var(--accent);
			}

			#qFeedback {
				margin: 0.2rem 0 0;
				font-size: 1.05rem;
				min-height: 1.4em;
			}

			#qFeedback.good {
				color: var(--good);
				font-weight: 600;
			}

			#qFeedback.bad {
				color: var(--bad);
			}

			.quiz-side {
				margin-left: auto;
				display: flex;
				flex-direction: column;
				align-items: flex-end;
				gap: 0.4rem;
				flex: none;
			}

			#score {
				font-size: 1.25rem;
				font-weight: 700;
				white-space: nowrap;
			}

			#score.pop {
				animation: pop 0.4s;
			}

			#nextQ {
				background: var(--good);
				border-color: var(--good);
				color: #fff;
				white-space: nowrap;
			}

			#nextQ.ready {
				background: var(--accent);
				border-color: var(--accent);
				animation: glow 1.2s ease-in-out infinite;
			}

			/* ---------- Infokortet ---------- */

			.card {
				animation: card-in 0.25s ease-out;
			}

			.card-head {
				display: flex;
				align-items: center;
				gap: 0.75rem;
			}

			.card-icon {
				font-size: clamp(3.2rem, 14vw, 4.2rem);
				line-height: 1;
				flex: none;
			}

			.card h2 {
				margin: 0;
				font-size: clamp(1.4rem, 5.5vw, 1.8rem);
				line-height: 1.15;
				text-wrap: balance;
			}

			.card .sub {
				margin: 0.15rem 0 0;
				font-size: 1rem;
				opacity: 0.75;
			}

			.card .say {
				margin-left: auto;
				flex: none;
				font-size: 1.4rem;
				padding: 0.2rem 0.55rem;
				align-self: flex-start;
			}

			.card .kid {
				font-size: 1.2rem;
				line-height: 1.45;
				margin: 0.8rem 0 0;
				text-wrap: pretty;
			}

			.facts {
				display: grid;
				gap: 0.4rem;
				margin: 0.9rem 0 0;
			}

			.facts div {
				display: flex;
				flex-wrap: wrap;
				justify-content: space-between;
				gap: 0 0.75rem;
				padding: 0.4rem 0.7rem;
				background: #eef6ff;
				border-radius: 0.75rem;
			}

			.facts dt {
				font-weight: 600;
			}

			.facts dd {
				margin: 0;
				text-align: right;
			}

			.facts a {
				color: var(--accent);
				font-weight: 600;
				text-underline-offset: 3px;
			}

			.more {
				margin-top: 0.9rem;
				border-top: 2px dashed #d0d7e2;
				padding-top: 0.6rem;
			}

			.more summary {
				cursor: pointer;
				font-weight: 600;
				color: var(--accent);
			}

			.more p {
				margin: 0.5rem 0 0;
				line-height: 1.5;
				text-wrap: pretty;
			}

			.card-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.4rem;
				margin-top: 0.9rem;
			}

			.card-actions button {
				font-size: 0.95rem;
				border-width: 2px;
			}

			.flags {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(4.4rem, 1fr));
				gap: 0.3rem;
				margin-top: 0.9rem;
				max-height: 18rem;
				overflow-y: auto;
				padding: 0.2rem;
			}

			.flags button {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.1rem;
				padding: 0.3rem 0.2rem;
				border: 2px solid transparent;
				border-radius: 0.75rem;
				background: #f4f7fb;
				font-size: 0.7rem;
				font-weight: 400;
				line-height: 1.1;
				text-align: center;
			}

			.flags button span {
				font-size: 1.9rem;
				line-height: 1.1;
			}

			@media (hover: hover) {
				.flags button:hover {
					border-color: var(--ink);
				}
			}

			/* ---------- Albumet med spännande platser ---------- */

			.album h2 {
				margin: 0 0 0.6rem;
				font-size: 1.25rem;
			}

			.album-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(3.2rem, 1fr));
				gap: 0.35rem;
			}

			.album-grid > * {
				aspect-ratio: 1;
				display: grid;
				place-items: center;
				border-radius: 0.9rem;
				font-size: 1.7rem;
				padding: 0;
			}

			.album-grid button {
				background: #fff3c4;
				border: 2px solid var(--gold);
			}

			.album-grid .locked {
				background: #eef1f5;
				color: #aab3c0;
				font-size: 1.3rem;
				font-weight: 700;
			}

			.album-grid .new {
				animation: pop 0.5s 2;
			}

			.album-hint {
				margin: 0.6rem 0 0;
				font-size: 0.95rem;
				opacity: 0.75;
			}

			.confetti {
				position: fixed;
				top: -16px;
				width: 10px;
				height: 14px;
				border-radius: 2px;
				z-index: 10;
				pointer-events: none;
				animation: fall linear forwards;
			}

			@keyframes fall {
				to {
					transform: translate(var(--dx), 110vh) rotate(var(--rot));
				}
			}

			@keyframes spin-bob {
				50% {
					transform: translateY(-6px) rotate(-12deg);
				}
			}

			@keyframes glow {
				50% {
					transform: scale(1.18);
				}
			}

			@keyframes blink {
				50% {
					opacity: 0.45;
				}
			}

			@keyframes pop {
				50% {
					transform: scale(1.35);
				}
			}

			@keyframes card-in {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before {
					animation: none !important;
				}
			}
		</style>
	</head>
	<body data-mode="utforska">
		<header>
			<span class="mode-icon" id="modeIcon">🌍</span>
			<div>
				<h1>Världen</h1>
				<p id="modeText"></p>
			</div>
			<div class="header-buttons">
				<button id="soundToggle" aria-label="Ljud av eller på"></button>
			</div>
		</header>

		<nav class="tabs">
			<button class="tab" data-mode="utforska">🗺️ Utforska</button>
			<button class="tab" data-mode="hitta">🎯 Hitta!</button>
		</nav>

		<main class="layout">
			<div class="map-col">
				<section class="panel quiz-bar" id="quizBar" hidden>
					<span id="qIcon"></span>
					<div>
						<p id="qText"></p>
						<p id="qFeedback"></p>
					</div>
					<div class="quiz-side">
						<span id="score">⭐ 0</span>
						<button id="nextQ">Hoppa över ➜</button>
					</div>

				return { x: (MAP.w - w) / 2, y: (MAP.h - h) / 2, w, h };
			}

			// Startvyn: hela världen, men på smala skärmar lite inzoomat så att länderna inte blir pyttesmå
			function homeView() {
				const a = aspect();
				const full = fullView();
				if (a >= 1.6) return full;
				const w = Math.min(full.w, MAP.h * a * 1.3);
				const h = w / a;
				return { x: 520 - w / 2, y: 255 - h / 2, w, h };
			}

			function clampView(v) {
				const a = aspect();
				const w = clamp(v.w, MAP.w / 18, fullView().w);
				const h = w / a;
				const cx = v.x + v.w / 2;
				const cy = v.y + v.h / 2;
				let x = cx - w / 2;
				let y = cy - h / 2;
				x = clamp(x, Math.min(0, MAP.w - w), Math.max(0, MAP.w - w));
				y = clamp(y, Math.min(0, MAP.h - h), Math.max(0, MAP.h - h));
				return { x, y, w, h };
			}

			function applyView() {
				svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
				const k = ppu();
				if (!k) return; // kartan har ingen storlek än
				// Markörerna är lagom stora oavsett zoom, men lite mindre när hela världen syns på en liten skärm
				const markerPx = clamp(40 * k, 18, 32);
				const labelPx = clamp(20 * k, 10, 16);
				for (const s of scaled) {
					const f = s.kind === 'marker' ? markerPx / 30 / k : labelPx / 14 / k;
					s.g.setAttribute('transform', `translate(${s.x} ${s.y}) scale(${f})`);
				}
			}

			function setView(v) {
				vb = clampView(v);
				applyView();
			}

			function animateTo(target, ms = 600) {
				cancelAnimationFrame(anim);
				const from = { ...vb };
				const to = clampView(target);
				const t0 = performance.now();
				const step = (now) => {
					const t = Math.min(1, (now - t0) / ms);
					const e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
					vb = {
						x: from.x + (to.x - from.x) * e,
						y: from.y + (to.y - from.y) * e,
						w: from.w + (to.w - from.w) * e,
						h: from.h + (to.h - from.h) * e
					};
					applyView();
					if (t < 1) anim = requestAnimationFrame(step);
				};
				anim = requestAnimationFrame(step);
			}

			function viewForBox([x0, y0, x1, y1], pad = 0.3, minW = MAP.w / 9) {
				const a = aspect();
				const bw = (x1 - x0) * (1 + pad * 2);
				const bh = (y1 - y0) * (1 + pad * 2);
				const w = Math.max(bw, bh * a, minW);
				const h = w / a;
				return { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - h / 2, w, h };
			}

			function zoomToPoint(x, y, w = MAP.w / 5) {
				animateTo(viewForBox([x, y, x, y], 0, w));
			}

			// Knappar utanför kartan som flyttar den scrollar upp kartan så att man ser vad som händer
			function scrollToMap() {
				const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
				// Vänta tills det nya kortet ritats, annars avbryts scrollningen när sidan byter höjd
				requestAnimationFrame(() =>
					$('mapWrap').scrollIntoView({ block: 'start', behavior: smooth ? 'smooth' : 'auto' })
				);
			}

			function zoomAt(factor, px, py, animate = false) {
				const k = ppu();
				const ux = vb.x + px / k;
				const uy = vb.y + py / k;
				const w = clamp(vb.w * factor, MAP.w / 18, fullView().w);
				const k2 = svg.clientWidth / w;
				const target = { x: ux - px / k2, y: uy - py / k2, w, h: w / aspect() };
				if (animate) animateTo(target, 300);
				else setView(target);
			}

			const pointers = new Map();
			let gesture = null;
			let dragged = false;

			function localPos(e) {
				const r = svg.getBoundingClientRect();
				return { x: e.clientX - r.left, y: e.clientY - r.top };
			}

			function beginGesture() {
				gesture = { vb: { ...vb }, k: ppu(), pts: [...pointers.values()].map((p) => ({ ...p })) };
			}

			svg.addEventListener('pointerdown', (e) => {
				if (e.button > 0) return;
				cancelAnimationFrame(anim);
				if (pointers.size === 0) dragged = false;
				pointers.set(e.pointerId, localPos(e));
				beginGesture();
			});

			window.addEventListener('pointermove', (e) => {
				if (!pointers.has(e.pointerId)) return;
				pointers.set(e.pointerId, localPos(e));
				const cur = [...pointers.values()];
				const g = gesture;
				if (cur.length === 1) {
					const dx = cur[0].x - g.pts[0].x;
					const dy = cur[0].y - g.pts[0].y;
					if (Math.hypot(dx, dy) > 6) dragged = true;
					if (dragged) setView({ ...g.vb, x: g.vb.x - dx / g.k, y: g.vb.y - dy / g.k });
				} else if (cur.length >= 2 && g.pts.length >= 2) {
					dragged = true;
					const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) || 1;
					const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
					const m0 = mid(g.pts[0], g.pts[1]);
					const m1 = mid(cur[0], cur[1]);
					const w = clamp((g.vb.w * dist(g.pts[0], g.pts[1])) / dist(cur[0], cur[1]), MAP.w / 18, fullView().w);
					const k2 = svg.clientWidth / w;
					const ux = g.vb.x + m0.x / g.k;
					const uy = g.vb.y + m0.y / g.k;
					setView({ x: ux - m1.x / k2, y: uy - m1.y / k2, w, h: w / aspect() });
				}
			});

			function endPointer(e) {
				if (!pointers.has(e.pointerId)) return;
				pointers.delete(e.pointerId);
				if (pointers.size > 0) return beginGesture();
				gesture = null;
				if (!dragged && e.type === 'pointerup') handleTap(e.clientX, e.clientY);
			}

			window.addEventListener('pointerup', endPointer);
			window.addEventListener('pointercancel', endPointer);

			svg.addEventListener(
				'wheel',
				(e) => {
					e.preventDefault();
					const p = localPos(e);
					zoomAt(Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), p.x, p.y);
				},
				{ passive: false }
			);

			$('zoomIn').addEventListener('click', () => zoomAt(1 / 1.7, svg.clientWidth / 2, svg.clientHeight / 2, true));
			$('zoomOut').addEventListener('click', () => zoomAt(1.7, svg.clientWidth / 2, svg.clientHeight / 2, true));
			$('zoomHome').addEventListener('click', () => animateTo(homeView()));
			$('bigMap').addEventListener('click', () => {
				$('mapWrap').classList.toggle('big');
				$('mapWrap').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
			});

			// Behåll mitten och zoomnivån när kartans storlek ändras
			let lastHomeW = 0;
			new ResizeObserver(() => {
				const wasFull = Math.abs(vb.w - lastHomeW) < 1;
				lastHomeW = homeView().w;
				setView(wasFull ? homeView() : { ...vb, h: vb.w / aspect() });
			}).observe(svg);

			// ---------- Vad trycktes det på? ----------

			function hitAt(cx, cy) {
				const el = document.elementFromPoint(cx, cy);
				if (!el || !svg.contains(el)) return null;
				const marker = el.closest('.marker');
				if (marker) return { kind: 'place', i: +marker.dataset.place };
				const label = el.closest('.ocean-label');
				if (label) return { kind: 'ocean', key: label.dataset.ocean };
				const land = el.closest('.land');
				if (land) return { kind: 'country', id: land.dataset.country };
				const p = localPos({ clientX: cx, clientY: cy });
				const k = ppu();
				const ll = invert(vb.x + p.x / k, vb.y + p.y / k);
				const key = ll && oceanAt(...ll);
				return key ? { kind: 'ocean', key } : null;
			}

			function handleTap(cx, cy) {
				const hit = hitAt(cx, cy);
				if (!hit) return;
				if (state.mode === 'hitta') return answer(hit);
				if (hit.kind === 'country') showCountry(hit.id);
				else if (hit.kind === 'place') showPlace(hit.i);
				else showOcean(hit.key);
			}

			// ---------- Infokort ----------

			function clearMarks() {
				for (const e of svg.querySelectorAll('.sel, .dim, .right, .wrong, .reveal')) {
					e.classList.remove('sel', 'dim', 'right', 'wrong', 'reveal');
				}
			}

			function selectCountry(id) {
				clearMarks();
				const el = landEls[id];
				el.classList.add('sel');
				el.parentNode.appendChild(el); // överst så att den tjocka kanten syns
			}

			function renderCard(c) {
				state.card = c;
				const card = $('card');
				const facts = c.facts?.length
					? `<dl class="facts">${c.facts.map(([e, l, v]) => `<div><dt>${e} ${l}</dt><dd>${v}</dd></div>`).join('')}</dl>`
					: '';
				const more = c.more
					? `<details class="more"><summary>Mer fakta</summary><p>${c.more}</p></details>`
					: '';
				card.innerHTML = `
					<div class="card-head">
						<div class="card-icon">${c.icon}</div>
						<div><h2>${c.title}</h2>${c.sub ? `<p class="sub">${c.sub}</p>` : ''}</div>
						<button class="say" aria-label="Läs upp">🔊</button>
					</div>
					${c.kid ? `<p class="kid">${c.kid}</p>` : ''}
					${facts}${more}${c.extra || ''}`;
				card.querySelector('.say').addEventListener('click', () => say(c.speech, false));
				// Starta animationen på nytt för varje nytt kort
				card.classList.remove('card');
				void card.offsetWidth;
				card.classList.add('card');
				if (c.onRender) c.onRender(card);
			}

			function showCountry(id, { zoom = false, speak = true } = {}) {
				const c = COUNTRIES[id];
				if (id === 'AQ') return showContinent('an', { zoom });
				const cont = CONTINENTS[c.cont];
				selectCountry(id);
				if (zoom) {
					scrollToMap();
					animateTo(viewForBox(c.box));
				}
				const fact = FACTS[id] || `${c.name} ligger i ${cont.name}.`;
				const facts = [];
				if (c.cap) facts.push(['🏛️', 'Huvudstad', c.cap]);
				facts.push([cont.icon, 'Världsdel', cont.name]);
				facts.push(['📖', 'Wikipedia', `<a href="${wikiUrl(id)}" target="_blank" rel="noopener">Läs mer ↗</a>`]);
				renderCard({
					icon: flag(id),
					title: c.name,
					sub: `${cont.icon} ${cont.name}`,
					kid: fact,
					facts,
					speech: `${c.name}. ${c.cap ? `Huvudstaden heter ${c.cap.replace(/\s*\(.*\)/, '')}. ` : ''}${fact}`,
					extra: `<div class="card-actions"><button data-cont="${c.cont}">${cont.icon} Läs om ${cont.name}</button></div>`,
					onRender: (card) =>
						card.querySelector('[data-cont]').addEventListener('click', () => showContinent(c.cont, { zoom: true }))
				});
				if (speak) say(`${c.name}. ${fact}`);
			}

			function showContinent(key, { zoom = false } = {}) {
				const cont = CONTINENTS[key];
				clearMarks();
				for (const [id, c] of Object.entries(COUNTRIES)) {
					if (c.cont !== key) landEls[id].classList.add('dim');
				}
				if (zoom) {
					scrollToMap();
					animateTo(viewForBox(boxFromLonLat(cont.box), 0.05));
				}
				const list = Object.values(COUNTRIES)
					.filter((c) => c.cont === key && c.id !== 'AQ')
					.sort((a, b) => a.name.localeCompare(b.name, 'sv'));
				const flags = list.length
					? `<div class="flags">${list
							.map((c) => `<button data-country="${c.id}"><span>${flag(c.id)}</span>${c.name}</button>`)
							.join('')}</div>`
					: '';
				renderCard({
					icon: cont.icon,
					title: cont.name,
					sub: cont.animals,
					kid: cont.kid,
					facts: cont.facts,
					more: cont.more,
					speech: `${cont.name}. ${cont.kid}`,
					extra: flags,
					onRender: (card) => {
						for (const b of card.querySelectorAll('.flags button')) {
							b.addEventListener('click', () => showCountry(b.dataset.country, { zoom: true }));
						}
					}
				});
				say(`${cont.name}. ${cont.kid}`);
			}

			function showOcean(key) {
				const o = OCEANS[key];
				clearMarks();
				renderCard({
					icon: o.icon,
					title: o.name,
					sub: o.parent ? `🌊 Ett innanhav till ${OCEANS[o.parent].name}` : '🌊 Världshav',
					kid: o.kid,
					facts: o.facts,
					more: o.more,
					speech: `${o.name}. ${o.kid}`
				});
				say(`${o.name}. ${o.kid}`);
			}

			function showPlace(i, { zoom = false } = {}) {
				const p = PLACES[i];
				clearMarks();
				const isNew = !state.found.has(i);
				if (isNew) {
					state.found.add(i);
					save('varlden-hittat', JSON.stringify([...state.found]));
					renderFound();
					renderAlbum(i);
					confetti(state.found.size === PLACES.length ? 120 : 30);
				}
				if (zoom) {
					scrollToMap();
					zoomToPoint(...project(...p.at));
				}
				const status = isNew
					? `✨ Ny upptäckt! Du har hittat ${state.found.size} av ${PLACES.length}.`
					: '✨ Spännande plats';
				renderCard({
					icon: p.icon,
					title: p.name,
					sub: status,
					kid: p.kid,
					more: p.more,
					speech: `${p.name}. ${p.kid}`
				});
				say(`${p.name}. ${p.kid}`);
			}

			function showWelcome() {
				clearMarks();
				renderCard({
					icon: '👋',
					title: 'Hej upptäckare!',
					kid: 'Tryck på ett land för att se dess flagga, eller på havet. De små bilderna på kartan är spännande platser – kan du hitta alla?',
					speech: 'Hej upptäckare! Tryck på ett land för att se dess flagga, eller på havet. De små bilderna på kartan är spännande platser. Kan du hitta alla?',
					extra: `<div class="card-actions">
						<button data-act="se">🇸🇪 Var bor vi?</button>
						<button data-act="random">🎲 Slumpa ett land</button>
					</div>`,
					onRender: (card) => {
						card.querySelector('[data-act="se"]').addEventListener('click', () => showCountry('SE', { zoom: true }));
						card.querySelector('[data-act="random"]').addEventListener('click', () => {
							const ids = Object.keys(COUNTRIES).filter((id) => COUNTRIES[id].cap);
							showCountry(pick(ids), { zoom: true });
						});
					}
				});
			}

			// ---------- Album ----------

			function renderAlbum(newIndex) {
				$('albumTitle').textContent = `✨ Spännande platser – ${state.found.size} av ${PLACES.length}`;
				const grid = $('albumGrid');
				grid.innerHTML = '';
				PLACES.forEach((p, i) => {
					if (state.found.has(i)) {
						const b = document.createElement('button');
						b.textContent = p.icon;
						b.title = p.name;
						b.setAttribute('aria-label', p.name);
						if (i === newIndex) b.classList.add('new');
						b.addEventListener('click', () => showPlace(i, { zoom: true }));
						grid.appendChild(b);
					} else {
						const d = document.createElement('div');
						d.className = 'locked';
						d.textContent = '?';
						grid.appendChild(d);
					}
				});
				$('albumHint').textContent =
					state.found.size === PLACES.length
						? '🏆 Du har hittat alla! Du är en riktig upptäcktsresande.'
						: 'Leta efter de små bilderna på kartan för att fylla albumet!';
			}

			// ---------- Världsdelsknappar ----------

			for (const key of ['eu', 'af', 'as', 'na', 'sa', 'oc', 'an']) {
				const c = CONTINENTS[key];
				const b = document.createElement('button');
				b.textContent = `${c.icon} ${c.name}`;
				b.style.setProperty('--c', `var(--${key})`);
				b.addEventListener('click', () => showContinent(key, { zoom: true }));
				$('continentBar').appendChild(b);
			}

			// ---------- Hitta! (frågelek) ----------

			function weighted(options) {
				const total = options.reduce((s, [w]) => s + w, 0);
				let r = Math.random() * total;
				for (const [w, f] of options) {
					if ((r -= w) < 0) return f();
				}
				return options[0][1]();
			}

			function countryQ(id) {
				const c = COUNTRIES[id];
				return { type: 'country', id, key: id, icon: flag(id), text: `Var ligger <b>${c.name}</b>?`, speech: `Var ligger ${c.name}?` };
			}

			function placeQ() {
				const i = Math.floor(Math.random() * PLACES.length);
				const p = PLACES[i];
				return { type: 'place', i, key: `p${i}`, icon: p.icon, text: p.q, speech: p.q };
			}

			function makeQuestion() {
				const next = () =>
					weighted([
						[3, () => {
							const key = pick(Object.keys(CONTINENTS));
							const c = CONTINENTS[key];
							return { type: 'continent', cont: key, key, icon: c.icon, text: `Tryck på <b>${c.name}</b>!`, speech: `Tryck på ${c.name}!` };
						}],
						[3, () => countryQ(pick(KID_COUNTRIES))],
						[3, placeQ],
						[1, () => {
							const key = pick(['pacific', 'atlantic', 'indian', 'arctic', 'southern']);
							const o = OCEANS[key];
							return { type: 'ocean', ocean: key, key, icon: o.icon, text: `Tryck på <b>${o.name}</b>!`, speech: `Tryck på ${o.name}!` };
						}]
					]);
				let q;
				for (let i = 0; i < 20; i++) {
					q = next();
					if (!state.recent.includes(q.key)) break;
				}
				state.recent = [...state.recent, q.key].slice(-10);
				return q;
			}

			function newQuestion() {
				const q = makeQuestion();
				state.quiz = { ...q, tries: 0, done: false };
				clearMarks();
				$('qIcon').textContent = q.icon;
				$('qText').innerHTML = q.text;
				setFeedback('');
				$('nextQ').textContent = 'Hoppa över ➜';
				$('nextQ').classList.remove('ready');
				svg.classList.toggle('hide-markers', q.type !== 'place');
				animateTo(homeView());
				say(q.speech);
			}

			function setFeedback(text, kind = '') {
				$('qFeedback').textContent = text;
				$('qFeedback').className = kind;
			}

			function isCorrect(q, hit) {
				if (q.type === 'country') return hit.kind === 'country' && hit.id === q.id;
				if (q.type === 'continent') return hit.kind === 'country' && COUNTRIES[hit.id].cont === q.cont;
				if (q.type === 'place') return hit.kind === 'place' && hit.i === q.i;
				if (q.type === 'ocean') return hit.kind === 'ocean' && (hit.key === q.ocean || OCEANS[hit.key].parent === q.ocean);
				return false;
			}

			function markTarget(q, cls) {
				if (q.type === 'country') {
					landEls[q.id].classList.add(cls);
					landEls[q.id].parentNode.appendChild(landEls[q.id]);
				} else if (q.type === 'continent') {
					for (const [id, c] of Object.entries(COUNTRIES)) if (c.cont === q.cont) landEls[id].classList.add(cls);
				} else if (q.type === 'place') {
					PLACES[q.i].el.classList.add(cls);
				} else {
					OCEANS[q.ocean].el.classList.add(cls);
				}
			}

			function zoomToTarget(q) {
				if (q.type === 'country') animateTo(viewForBox(COUNTRIES[q.id].box, 0.6, MAP.w / 5));
				else if (q.type === 'continent') animateTo(viewForBox(boxFromLonLat(CONTINENTS[q.cont].box), 0.05));
				else if (q.type === 'place') zoomToPoint(...project(...PLACES[q.i].at), MAP.w / 3);
				else zoomToPoint(...project(...OCEANS[q.ocean].label), MAP.w / 2);
			}

			function nameOf(hit) {
				if (hit.kind === 'country') return `${flag(hit.id)} ${COUNTRIES[hit.id].name}`;
				if (hit.kind === 'place') return `${PLACES[hit.i].icon} ${PLACES[hit.i].name}`;
				return `${OCEANS[hit.key].icon} ${OCEANS[hit.key].name}`;
			}

			function finishQuestion() {
				state.quiz.done = true;
				$('nextQ').textContent = 'Nästa ➜';
				$('nextQ').classList.add('ready');
			}

			function answer(hit) {
				const q = state.quiz;
				if (!q || q.done) {
					// Efter rätt svar kan man fortsätta trycka för att läsa om platser
					if (hit.kind === 'country') showCountry(hit.id, { speak: false });
					return;
				}
				if (isCorrect(q, hit)) {
					markTarget(q, 'right');
					state.score++;
					$('score').textContent = `⭐ ${state.score}`;
					$('score').classList.remove('pop');
					void $('score').offsetWidth;
					$('score').classList.add('pop');
					const praise = pick(PRAISE);
					const answerName = q.type === 'continent' ? `${CONTINENTS[q.cont].icon} ${CONTINENTS[q.cont].name}` : nameOf(hit);
					setFeedback(`${praise} Det där är ${answerName}.`, 'good');
					say(`${praise} Det där är ${answerName}.`);
					confetti(40);
					finishQuestion();
					// Visa fakta om svaret så att man lär sig något på köpet
					if (q.type === 'country') showCountry(q.id, { speak: false });
					return;
				}
				q.tries++;
				if (hit.kind === 'country') {
					const el = landEls[hit.id];
					el.classList.add('wrong');
					setTimeout(() => el.classList.remove('wrong'), 900);
				}
				if (q.tries >= 3) {
					markTarget(q, 'reveal');
					zoomToTarget(q);
					setFeedback('Här är det! 👀 Titta där det blinkar.', 'bad');
					say('Här är det! Titta där det blinkar.');
					finishQuestion();
					if (q.type === 'country') showCountry(q.id, { speak: false });
					return;
				}
				const msg = `Det där är ${nameOf(hit)}. Försök igen!`;
				setFeedback(msg, 'bad');
				say(msg);
			}

			$('nextQ').addEventListener('click', newQuestion);

			// ---------- Lägen, nivå och ljud ----------

			const MODES = {
				utforska: { icon: '🌍', text: 'Tryck på kartan och upptäck världen!' },
				hitta: { icon: '🎯', text: 'Hitta rätt på kartan!' }
			};

			function setMode(mode) {
				state.mode = mode;
				document.body.dataset.mode = mode;
				$('modeIcon').textContent = MODES[mode].icon;
				$('modeText').textContent = MODES[mode].text;
				for (const t of document.querySelectorAll('.tab')) t.classList.toggle('active', t.dataset.mode === mode);
				const quiz = mode === 'hitta';
				$('quizBar').hidden = !quiz;
				$('continentBar').hidden = quiz;
				$('album').hidden = quiz;
				svg.classList.remove('hide-markers');
				if (quiz) {
					state.score = 0;
					$('score').textContent = '⭐ 0';
					renderCard({
						icon: '🎯',
						title: 'Hitta!',
						kid: 'Lyssna på frågan och tryck på rätt ställe på kartan. Du får försöka tre gånger!',
						speech: 'Lyssna på frågan och tryck på rätt ställe på kartan.'
					});
					newQuestion();
				} else {
					state.quiz = null;
					showWelcome();
					animateTo(homeView());
				}
			}

			for (const t of document.querySelectorAll('.tab')) {
				t.addEventListener('click', () => setMode(t.dataset.mode));
			}

			function renderSound() {
				$('soundToggle').textContent = state.sound ? '🔊' : '🔇';
			}

			$('soundToggle').addEventListener('click', () => {
				state.sound = !state.sound;
				save('varlden-ljud', state.sound ? 'pa' : 'av');
				if (!state.sound && canSpeak) speechSynthesis.cancel();
				renderSound();
			});

			function confetti(count) {
				if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
				const colors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ff9f1c'];
				for (let i = 0; i < count; i++) {
					const c = document.createElement('span');
					c.className = 'confetti';
					c.style.left = `${Math.random() * 100}vw`;
					c.style.background = pick(colors);
					c.style.setProperty('--dx', `${(Math.random() - 0.5) * 200}px`);
					c.style.setProperty('--rot', `${Math.random() * 1080}deg`);
					c.style.animationDuration = `${1.4 + Math.random() * 1.4}s`;
					c.style.animationDelay = `${Math.random() * 0.3}s`;
					c.addEventListener('animationend', () => c.remove());
					document.body.appendChild(c);
				}
			}

			renderSound();
			renderFound();
			renderAlbum(null);
			setView(homeView());
			setMode('utforska');
		</script>
	</body>
</html>
